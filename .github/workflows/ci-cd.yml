name: Todo App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # Job 1: Run Python tests
  # ==========================================

  test:

    runs-on: ubuntu-latest

    steps:

      # Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install application dependencies
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      # Run unit tests
      - name: Run tests
        run: |
          pytest


  # ==========================================
  # Job 2: Build and push Docker image
  # ==========================================

  docker:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t poornimab03/todo-app:v1.0 \
            -t poornimab03/todo-app:latest \
            .

      # Push version tag
      - name: Push version tag
        run: |
          docker push poornimab03/todo-app:v1.0

      # Push latest tag
      - name: Push latest tag
        run: |
          docker push poornimab03/todo-app:latest
