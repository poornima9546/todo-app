services:

  # ==========================================
  # Python Flask Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-app

    # Flask listens on port 5000 inside the container
    # Nginx will access it through the Docker network
    ports:
      - "${APP_PORT}:5000"

    # Environment variables for database connection
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # Start Flask only after MySQL becomes healthy
    depends_on:
      mysql:
        condition: service_healthy

    # Application health check
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Custom Docker network
    networks:
      - todo_network


  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0

    container_name: todo-mysql

    # MySQL configuration
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    # Persistent database storage
    # Initialization script runs when database is initialized
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # MySQL health check
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Custom Docker network
    networks:
      - todo_network


  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:latest

    container_name: todo-nginx

    # Expose only Nginx to the host
    ports:
      - "8088:80"

    # Nginx configuration
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    # Start Nginx after Flask becomes healthy
    depends_on:
      app:
        condition: service_healthy

    # Custom Docker network
    networks:
      - todo_network


# ==========================================
# Persistent Volumes
# ==========================================
volumes:

  # MySQL data survives container recreation
  mysql_data:


# ==========================================
# Custom Docker Network
# ==========================================
networks:

  todo_network:
    driver: bridge
